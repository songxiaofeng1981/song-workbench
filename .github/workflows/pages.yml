name: 更新并发布项目工作台

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 9-17 * * 1-5'
      timezone: Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.activity.outputs.stale }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 检查定时任务的仓库活动
        id: activity
        if: github.event_name == 'schedule'
        run: |
          last_commit=$(git log -1 --format=%ct)
          if [ "$(($(date +%s) - last_commit))" -ge 3888000 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 获取公开项目并生成页面
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

  keep-schedule-active:
    if: github.event_name == 'schedule' && needs.build.outputs.stale == 'true'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: 保持定时任务启用
        run: |
          last_commit=$(git log -1 --format=%ct)
          if [ "$(($(date +%s) - last_commit))" -lt 3888000 ]; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
              commit --allow-empty -m "Keep the workbench schedule active"
          git push origin HEAD:main
