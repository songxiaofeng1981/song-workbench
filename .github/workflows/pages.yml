name: 更新并发布项目工作台

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 9-17 * * 1-5'
      timezone: Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 获取公开项目并生成页面
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
